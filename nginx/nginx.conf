# 给【容器里的 nginx】用，由 web/Dockerfile 挂到 /etc/nginx/conf.d/default.conf。
#
# 访问: http://localhost:8081
#
# 分工：
#   /api/*  → Go 后端容器（用服务名 api，走 compose 内部网络）
#   /app/*  → Flutter web 产物（可选，挂载了才有）
#   其它    → Vue 构建产物 dist/（在容器里是 /usr/share/nginx/html）
#
# 这个配置只用于生产形态。开发时是 Vite dev server 在干活
# （编译 .vue + 自己转发 /api），压根不经过 nginx。

server {
    listen 80;

    # 容器里就这一个站点，接受任何 Host。
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Vue 前端 ----
    #
    # try_files 的第三个参数是兜底：路径在磁盘上找不到对应文件时返回
    # index.html。这是给 vue-router 的 history 模式用的 —— 用户直接访问
    # /login 时服务器上并没有 login 这个文件，得让前端自己接管路由。
    # 少了这一条，在任意非根路径上刷新都会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 静态资源缓存 ----
    #
    # Vite 产出的文件名带内容哈希（index-DZypcanB.js），内容变了文件名就变，
    # 所以可以放心让浏览器长期缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 反过来，绝对不能缓存：它记录着当前版本引用的是哪些
    # 带哈希的资源文件。把它缓存住，用户会一直加载旧版本的引用表。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---- API 反向代理 ----
    #
    # proxy_pass 末尾【不带】斜杠，路径原样转发：/api/todos 到后端还是 /api/todos。
    #
    # 如果写成 proxy_pass http://api:8080/; （末尾带斜杠），nginx 会用它替换掉
    # location 匹配到的 /api/ 前缀，后端收到的就变成 /todos —— 全部 404。
    # 这是 nginx 反代最经典的一个坑，两种写法都"看起来对"。
    #
    # 服务名 api 由 compose 的内部 DNS 解析，不需要知道它在哪台机器上。
    location /api/ {
        proxy_pass http://api:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 健康检查 ----
    # 单独转发，免得要经过 /api 前缀。access_log off 是因为
    # 探针每 10 秒打一次，会把访问日志淹掉。
    location = /readyz {
        proxy_pass http://api:8080/readyz;
        access_log off;
    }

    # ---- Flutter web 产物（可选）----
    #
    # compose 把 ./app/build/web 挂到 /srv/flutter/app。
    # 挂载存在时这里提供 Flutter 客户端；没挂载时返回 404，
    # 完全不影响上面的 Vue 前端。
    #
    # 让 Flutter 和 Vue 共用同一个源是有意的：Flutter 的 baseUrl 就可以写成
    # 相对路径 /api，同源、不涉及跨域，也就不需要在后端加 CORS 中间件。
    location /app/ {
        root /srv/flutter;
        # 这里刻意【不写】$uri/。
        #
        # 两个都试过：
        #   写 $uri/ —— 没挂载产物时，/app/ 会匹配到那个空的卷目录，
        #     nginx 转去要 index 文件，找不到就回 403（禁止列目录），
        #     try_files 的兜底根本没机会执行。
        #   不写 —— 目录请求直接落到兜底，返回干净的 404 或 index.html。
        # Flutter 的产物里没有需要靠目录索引来提供的路径（都是带哈希的
        # 具体文件名），所以去掉 $uri/ 没有任何损失。
        #
        # 兜底交给具名 location，而不是直接写 /app/index.html：
        # 如果 /app/index.html 本身不存在，直接兜底会让请求重新匹配回
        # 本 location，形成内部重定向循环，nginx 会返回 500。
        try_files $uri @flutter_fallback;
    }

    location @flutter_fallback {
        root /srv/flutter;
        try_files /app/index.html =404;
    }

    # Flutter 的 service worker 必须禁缓存，否则发布新版本之后浏览器
    # 还在跑旧的 SW，表现为"明明重新部署了，界面却一直是旧的"。
    location = /app/flutter_service_worker.js {
        root /srv/flutter;
        add_header Cache-Control "no-store";
    }
}
