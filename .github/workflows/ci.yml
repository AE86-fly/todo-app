# 本地等价物是 `make check` —— 覆盖的步骤完全一样：go vet / go test /
# vue-tsc / flutter analyze / flutter test。
#
# 但**机制不同**，这点值得说清楚：`make check` 走的是容器里的工具链
# （挂载编译，见 Makefile 顶部和 README），而这里用的是 runner 自带的
# Go 和 Node（由 setup-go / setup-node 固定版本）。原因是每次 CI 都去构建
# 两个工具链镜像纯属浪费 —— runner 本来就是一次性的、版本已经被 setup-*
# 钉死了，不需要容器再提供一致性。
#
# 所以：本地绿了不代表 CI 一定绿（工具链版本可能不同），
# 反过来也一样。两边都跑才算数。
#
# ✅ 已在真实 GitHub runner 上验证过：run #1（commit 9445e94）四个 job 全绿，
#    与本地 act 的结论一致。
#
#    （此前这里写的是"尚未在真实 runner 上运行过"——那是当时的真实状态：
#    仓库没有 remote，`on: push` 触发不了。推送后该结论已闭环，故更新。）
#
# 有 publish job（推镜像到 ghcr.io）和 deploy job（把镜像拉到服务器上重启）。
#
# deploy 是后来才加的，原因值得记一笔：最初刻意不写它 —— 推镜像只需要 GitHub
# 自己发的 GITHUB_TOKEN，而部署需要一整套真实基础设施（服务器、SSH 私钥、
# 服务器上的目录），在模板里凭空写一个既跑不了也验证不了。
# 现在这台服务器真实存在、也确实在跑这个项目，部署这一步才第一次变得
# 可执行、可验证 —— 不是"补全了一个看起来完整的模板"，而是有了真实的落点。
#
# 需要的 secrets：DEPLOY_SSH_KEY / DEPLOY_HOST / DEPLOY_KNOWN_HOSTS。
# 用的是**专用部署密钥**，不是个人密钥：一旦要作废，只需从服务器上删掉
# authorized_keys 里那一行，不影响个人身份的其它用途。

name: CI

# 全局 env。
#
# GOPROXY：**必须**。backend/Dockerfile 里已经声明了同一个代理
# （`ARG GOPROXY=https://goproxy.cn,direct`），CI 这边不设就是内部不一致。
# 而且默认的 proxy.golang.org 在这台开发机上直连不通 —— 实测 go mod download
# 会卡满 5 分钟再报 i/o timeout。goproxy.cn 在 GitHub 的 runner 上同样可达，
# 所以两边都能跑，代价只是海外 runner 上稍慢一点。
#
# GOTOOLCHAIN：钉成 local，禁止 go 因为 go.mod 里的版本号去下载另一个工具链。
# go.mod 写的是 1.27.1，setup-go 装的也是 1.27.1，本来就不会触发；
# 但万一以后两者不同步，这个设置能让它在本地就报错，而不是悄悄下载一个。
env:
  GOPROXY: https://goproxy.cn,direct
  GOTOOLCHAIN: local

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: 下载依赖
        working-directory: backend
        run: go mod download

      - name: 静态检查
        working-directory: backend
        run: go vet ./...

      # -race 在 CI 里开着：本地为了快常常不带，但数据竞争
      # 正是那种"本地跑一百次都没事、上线才出问题"的 bug。
      - name: 单元测试
        working-directory: backend
        run: go test ./... -count=1 -race

      - name: 构建
        working-directory: backend
        run: go build ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 下载依赖
        working-directory: web
        # npm ci 要求 package-lock.json 存在且与之严格一致。
        # 原教程用的是 npm install，锁文件从来没被提交过 ——
        # 所以那一版 CI 的这一步在真实 runner 上必然失败。
        run: npm ci

      - name: 类型检查
        working-directory: web
        run: npm run type-check

      - name: 构建
        working-directory: web
        run: npm run build

  # Flutter 客户端的静态检查与测试。
  #
  # 这个 job 是补上的：在此之前，本文件头部和 README 都写着"覆盖的步骤与
  # `make check` 相同（含 flutter analyze / flutter test）"，但 CI 里根本没有
  # Flutter —— `make check` 会跑，CI 从来不跑。那句话当时是不成立的。
  # 补上之后口径才真正一致：Flutter 改动现在也会被 PR 拦住。
  #
  # 用 subosito/flutter-action 而不是手装 SDK：它会缓存 SDK 和 pub 依赖，
  # 第二次之后拉起开销可以忽略。
  #
  # 版本钉死成和开发机相同的 3.47.5。不钉的话默认装 latest stable，
  # 上游某天发版会让 CI 无声地换一套环境 —— 那时候红/绿的含义就变了。
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: 下载依赖
        working-directory: app
        run: flutter pub get

      - name: 静态检查
        working-directory: app
        run: flutter analyze

      - name: 测试
        working-directory: app
        run: flutter test

  # 端到端：把整套真正拉起来，跑 scripts/verify.sh 里的那些断言。
  #
  # 这一步不能省。前面两个 job 全绿，也只说明"各层自己没问题"——
  # 接线错了（路由前缀拼重、nginx 转发的路径不对、健康检查的依赖顺序
  # 没配）它们一个都发现不了，而这恰恰是最容易出错的地方。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 .env
        # 这些值只在本次 CI 运行里有效，用完即弃。
        run: |
          {
            echo "POSTGRES_USER=todo"
            echo "POSTGRES_DB=todo"
            echo "POSTGRES_PASSWORD=ci-$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
          } > .env

      - name: 构建并启动
        run: docker compose up -d --build

      - name: 等待服务健康
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/readyz >/dev/null 2>&1; then
              echo "服务已就绪"
              exit 0
            fi
            sleep 2
          done
          echo "等待超时，导出日志："
          docker compose logs
          exit 1

      - name: 端到端验收
        run: ./scripts/verify.sh

      - name: 失败时导出日志
        if: failure()
        run: docker compose logs

  # 测试全过了才推镜像。三个 job 都 needs 上，任何一个挂了都不会推 ——
  # 避免"测试失败但镜像已经发出去了"这种最难收拾的状态。
  #
  # flutter 刻意【不】挂在这里。理由和 nginx 配置里那条"Flutter 是可选件、
  # 不该拖累主链路"是同一个：publish 产出的 api / web 镜像与 Flutter 客户端
  # 毫无关系，把它挂进来会让客户端测试失败直接冻结服务端部署。
  # Flutter 挂了自己会红，但不拦发布。
  publish:
    needs: [backend, web, e2e]
    # 只在 main 的 push 上推。PR 也推的话，任何人都能往 registry 里塞镜像。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # ghcr 需要这个才能推

    steps:
      - uses: actions/checkout@v4

      # ghcr 的镜像路径必须全小写，而 github.repository 的大小写跟随用户名
      # 和仓库名。直接拼会在 push 时被 registry 拒掉，报错信息很难指向根因。
      # ${VAR,,} 是 bash 的小写展开。
      - name: 计算镜像前缀（转小写）
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 两个 tag：sha-<commit> 用于精确定位和回滚，latest 用于"就要最新的"。
      # 只推 latest 的话，出问题想回退都找不到旧镜像。
      - name: 推 api 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/api:latest
          # gha 缓存配合 Dockerfile 里已有的 BuildKit cache mount，
          # 第二次之后的构建会快很多。
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 推 web 镜像
        uses: docker/build-push-action@v6
        with:
          # 上下文是项目根而不是 web/：web/Dockerfile 要 COPY nginx/nginx.conf
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/web:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 部署：把新镜像拉到服务器上重启。
  #
  # needs publish —— 镜像没推成功就谈不上部署。
  # 触发条件和 publish 一样，只在 main 的 push 上跑。
  #
  # 用裸 ssh 而不是 appleboy/ssh-action：少一个第三方 action，就少一处
  # 供应链和版本漂移的风险。这里只需要 openssh，runner 上本来就有。
  #
  # 刻意【不】在服务器上 docker image prune：留着旧镜像，回滚才有东西可回。
  # 代价是磁盘会慢慢涨，需要时手动清（40G 盘，不急）。
  deploy:
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 配置 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          # 先显式检查：secret 没配时，报一句人话，而不是让 ssh 报
          # "Permission denied" 让人去猜到底是密钥错还是压根没配。
          if [[ -z "$DEPLOY_SSH_KEY" || -z "$DEPLOY_KNOWN_HOSTS" ]]; then
            echo "::error::缺少 DEPLOY_SSH_KEY 或 DEPLOY_KNOWN_HOSTS，见 README 的 CD 一节"
            exit 1
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          # 私钥必须 600 —— ssh 会拒绝加载权限过宽的私钥，
          # 而报错只说 "bad permissions"，不说该怎么办。
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # 主机密钥来自 secret，不用 ssh-keyscan：keyscan 是 TOFU
          # （第一次连上谁就信谁），中间人只要赢那一次就够了。
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 拉取新镜像并重启
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [[ -z "$DEPLOY_HOST" ]]; then
            echo "::error::缺少 DEPLOY_HOST，见 README 的 CD 一节"
            exit 1
          fi

          # 远端脚本走 stdin（bash -s + 带引号的 heredoc），
          # 这样整段脚本不用塞进 ssh 的单引号里 —— 省掉一层转义地狱，
          # 也就不用为了转义把脚本写走样。
          #
          # BatchMode=yes：密钥不通时立刻失败，而不是挂在那里等密码输入
          # （CI 里没人能输入密码，等就是一个必然的超时）。
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              "ubuntu@$DEPLOY_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd ~/todo-app

          docker compose pull
          docker compose up -d --no-build

          # 等"真的能接流量"，而不是等容器 Up。
          # 刚起来的几秒里容器状态就是 Up，但后端可能还没连上数据库 ——
          # /readyz 会连带检查数据库连通性，这才是可接流的信号。
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1/readyz >/dev/null 2>&1; then
              echo "部署完成：服务已就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 2
          done

          echo "等待超时，导出日志："
          docker compose logs --tail=50
          exit 1
          REMOTE
